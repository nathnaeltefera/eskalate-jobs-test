version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres:
    image: postgres:15-alpine
    container_name: eskalte-jobs-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: eskalte_jobs_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development API (with hot reload)
  api-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: eskalte-jobs-api-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eskalte_jobs_dev
      JWT_SECRET: dev_jwt_secret_key
      JWT_EXPIRES_IN: 7d
      BASE_URL: http://localhost:8080
      # Add your Cloudinary credentials here for development
      CLOUDINARY_CLOUD_NAME: your_cloud_name
      CLOUDINARY_API_KEY: your_api_key
      CLOUDINARY_API_SECRET: your_api_secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        echo 'Setting up development environment...' &&
        npx prisma migrate dev --name init &&
        echo 'Starting development server with hot reload...' &&
        npm run dev
      "

  # Adminer for database management
  adminer:
    image: adminer:latest
    container_name: eskalte-jobs-adminer-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_dev_data: